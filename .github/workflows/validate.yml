name: Validate NatoFX

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/live-distribution-analysis]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run type-check
      - name: Run tests
        run: npm test -- --runInBand
      - name: Build production bundle
        run: npm run build
